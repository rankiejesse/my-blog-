<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇 - 手机触屏版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px 10px;
            overflow: hidden;
        }

        .header {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #94a3b8;
        }

        .score-board span {
            color: #4ade80;
            font-weight: bold;
        }

        canvas {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            display: block;
            touch-action: none;
            max-width: 90vw;
            max-height: 90vw;
        }

        /* 虚拟方向键控制盘 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 10px;
        }

        .dpad-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .dpad-btn:active {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-restart {
            margin-top: 5px;
            padding: 8px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>经典贪吃蛇</h1>
    <div class="score-board">
        <div>得分: <span id="currentScore">0</span></div>
        <div>最高纪录: <span id="highScore">0</span></div>
    </div>
</div>

<canvas id="gameCanvas" width="360" height="360"></canvas>

<!-- 虚拟方向键盘 -->
<div class="dpad">
    <div></div>
    <button class="dpad-btn" onclick="setDir('UP')">▲</button>
    <div></div>
    <button class="dpad-btn" onclick="setDir('LEFT')">◄</button>
    <div></div>
    <button class="dpad-btn" onclick="setDir('RIGHT')">►</button>
    <div></div>
    <button class="dpad-btn" onclick="setDir('DOWN')">▼</button>
    <div></div>
</div>

<button class="btn-restart" onclick="resetGame()">重新开始</button>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const currentScoreEl = document.getElementById("currentScore");
    const highScoreEl = document.getElementById("highScore");

    const grid = 18;
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = grid, dy = 0;
    let score = 0;
    let speed = 120;
    let gameLoop = null;
    let changingDirection = false;

    let highScore = parseInt(localStorage.getItem("snake_touch_highscore")) || 0;
    highScoreEl.innerText = highScore;

    function initGame() {
        snake = [{ x: 144, y: 180 }, { x: 126, y: 180 }, { x: 108, y: 180 }];
        score = 0;
        dx = grid; dy = 0; speed = 120;
        currentScoreEl.innerText = score;
        createFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(main, speed);
    }

    function main() {
        if (hasGameEnded()) {
            clearInterval(gameLoop);
            alert("游戏结束！最终得分: " + score);
            return;
        }
        changingDirection = false;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawFood();
        moveSnake();
        drawSnake();
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
            ctx.fillRect(part.x, part.y, grid - 1, grid - 1);
        });
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);
        if (snake[0].x === food.x && snake[0].y === food.y) {
            score += 10;
            currentScoreEl.innerText = score;
            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem("snake_touch_highscore", highScore);
            }
            createFood();
        } else {
            snake.pop();
        }
    }

    function hasGameEnded() {
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
        }
        return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
    }

    function createFood() {
        food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
        food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
    }

    function drawFood() {
        ctx.fillStyle = "#f43f5e";
        ctx.fillRect(food.x, food.y, grid - 1, grid - 1);
    }

    function setDir(dir) {
        if (changingDirection) return;
        if (dir === 'LEFT' && dx === 0) { dx = -grid; dy = 0; changingDirection = true; }
        if (dir === 'UP' && dy === 0) { dx = 0; dy = -grid; changingDirection = true; }
        if (dir === 'RIGHT' && dx === 0) { dx = grid; dy = 0; changingDirection = true; }
        if (dir === 'DOWN' && dy === 0) { dx = 0; dy = grid; changingDirection = true; }
    }

    // 屏幕手势滑动支持
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener("touchstart", e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener("touchend", e => {
        const dxTouch = e.changedTouches[0].clientX - touchStartX;
        const dyTouch = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
            if (dxTouch > 20) setDir('RIGHT');
            else if (dxTouch < -20) setDir('LEFT');
        } else {
            if (dyTouch > 20) setDir('DOWN');
            else if (dyTouch < -20) setDir('UP');
        }
    }, { passive: true });

    function resetGame() { initGame(); }
    initGame();
</script>
</body>
</html>
