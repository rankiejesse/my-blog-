<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>掌上 MD 便签</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: #f3f4f6; color: #1f2937; min-height: 100vh; padding-bottom: 80px; }
header { position: sticky; top: 0; background: #ffffff; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); z-index: 10; }
.search-box { width: 100%; padding: 11px 16px; border: 1px solid #e5e7eb; border-radius: 20px; background: #f9fafb; font-size: 16px; outline: none; }
.search-box:focus { border-color: #6366f1; background: #fff; }
/* 笔记列表 - 便利贴网格 */
.notes-grid { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
/* 便利贴卡片 */
.note-card { background: #fef08a; /* 经典黄色便利贴颜色 */ border-radius: 12px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: 180px; cursor: pointer; position: relative; user-select: none; transition: transform 0.1s ease, box-shadow 0.1s ease; }
.note-card:active { transform: scale(0.98); }
/* 卡片背景颜色变化机制 */
.note-card:nth-child(2n) { background: #bae6fd; } /* 淡蓝 */
.note-card:nth-child(3n) { background: #bbf7d0; } /* 淡绿 */
.note-card:nth-child(4n) { background: #fbcfe8; } /* 淡粉 */
.note-card .title { font-weight: bold; font-size: 15px; margin-bottom: 6px; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 前几行折叠预览 */
.note-card .preview-content { font-size: 12px; color: #374151; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; /* 只展示前3行 */ -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.note-card .tags-row { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; overflow: hidden; max-height: 22px; }
.tag-badge { background: rgba(255, 255, 255, 0.6); font-size: 10px; padding: 2px 6px; border-radius: 4px; color: #374151; }
.remark-badge { background: rgba(239, 68, 68, 0.15); color: #b91c1c; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card .timestamps { margin-top: 8px; font-size: 9px; color: #6b7280; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 4px; }
/* 浮动新建按钮 */
.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #6366f1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); border: none; outline: none; cursor: pointer; z-index: 20; }
.fab:active { transform: scale(0.92); }
/* 全屏弹窗/视图 */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; z-index: 30; display: none; flex-direction: column; }
.modal.active { display: flex; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
.modal-header button { background: none; border: none; font-size: 16px; color: #6366f1; font-weight: 600; cursor: pointer; padding: 6px 8px; }
.modal-header .btn-delete { color: #ef4444; }
.modal-body { flex: 1; overflow-y: auto; padding: 16px; }
/* 编辑模式工具栏 */
.editor-toolbar { display: flex; gap: 6px; padding: 8px 12px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb; overflow-x: auto; white-space: nowrap; }
.editor-toolbar button { background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 500; color: #374151; }
.editor-input { width: 100%; border: none; outline: none; font-size: 16px; margin-bottom: 14px; }
.editor-title-input { font-size: 21px; font-weight: bold; border-bottom: 1px solid #f3f4f6; padding: 10px 0; }
.editor-textarea { width: 100%; min-height: 45vh; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.7; font-family: monospace, sans-serif; }
.meta-fields { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; background: #f9fafb; padding: 10px; border-radius: 8px; }
.meta-fields input { padding: 9px 12px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 15px; }
/* Markdown 展示模式排版 */
.md-render h1 { font-size: 22px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; margin: 12px 0 8px; color: #111827; }
.md-render h2 { font-size: 18px; margin: 10px 0 6px; color: #1f2937; }
.md-render p { font-size: 15px; line-height: 1.6; margin-bottom: 8px; color: #374151; }
.md-render blockquote { border-left: 4px solid #6366f1; padding-left: 10px; color: #6b7280; margin: 8px 0; background: #f9fafb; padding-top: 4px; padding-bottom: 4px; }
.md-render ul { padding-left: 20px; margin-bottom: 8px; }
.md-render li { margin-bottom: 4px; line-height: 1.5; }
.view-time-info { font-size: 11px; color: #9ca3af; margin-bottom: 15px; border-bottom: 1px dashed #e5e7eb; padding-bottom: 8px; }
.empty-tip { text-align: center; color: #9ca3af; margin-top: 60px; font-size: 14px; }
</style>
</head>
<body>
<!-- 顶部搜索栏 -->
<header>
<input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索标题、正文、标签或备注..." oninput="renderNotes()">
</header>
<!-- 便利贴卡片列表 -->
<div id="notesGrid" class="notes-grid"></div>
<!-- 浮动新建按钮 -->
<button class="fab" onclick="openEditor()">+</button>
<!-- 阅读/展示全屏 Modal (MD渲染效果) -->
<div id="viewModal" class="modal">
<div class="modal-header">
<button onclick="closeModal('viewModal')">◀ 返回</button>
<div>
<button onclick="switchToEditMode()">编辑</button>
<button class="btn-delete" onclick="deleteCurrentNote()">删除</button>
</div>
</div>
<div class="modal-body">
<h1 id="viewTitle" style="font-size:22px; margin-bottom:6px;"></h1>
<div id="viewTimes" class="view-time-info"></div>
<div id="viewTags" style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;"></div>
<div id="viewRemark" style="display:none;" class="remark-badge"></div>
<div id="viewContent" class="md-render" style="margin-top:15px;"></div>
</div>
</div>
<!-- 新建/编辑 Modal -->
<div id="editModal" class="modal">
<div class="modal-header">
<button onclick="closeModal('editModal')">取消</button>
<button onclick="saveNote()">保存</button>
</div>
<!-- Markdown 插入工具栏 -->
<div class="editor-toolbar">
<button onclick="insertMD('# ')">大标题</button>
<button onclick="insertMD('## ')">小标题</button>
<button onclick="insertMD('**', '**')">粗体</button>
<button onclick="insertMD('- ')">无序列表</button>
<button onclick="insertMD('> ')">引用</button>
</div>
<div class="modal-body">
<input type="text" id="editTitle" class="editor-input editor-title-input" placeholder="笔记标题...">
<textarea id="editContent" class="editor-textarea" placeholder="在此输入 Markdown 风格正文..."></textarea>
<div class="meta-fields">
<input type="text" id="editTags" placeholder="自定义标签 (多个用英文逗号或空格隔开)">
<input type="text" id="editRemark" placeholder="自定义备注 (为空则不展示)">
</div>
</div>
</div>
<script>
// 存储变量与初始化
let notes = JSON.parse(localStorage.getItem('mobile_md_notes')) || [];
let currentNoteId = null;
let longPressTimer = null;
// 时间格式化辅助函数 (精确到本地时间的分，例如: 2026/08/05 12:07)
function formatTime(dateStr) {
const d = new Date(dateStr);
const year = d.getFullYear();
const month = String(d.getMonth() + 1).padStart(2, '0');
const day = String(d.getDate()).padStart(2, '0');
const hours = String(d.getHours()).padStart(2, '0');
const minutes = String(d.getMinutes()).padStart(2, '0');
return `${year}/${month}/${day} ${hours}:${minutes}`;
}
// 渲染便利贴卡片列表
function renderNotes() {
const grid = document.getElementById('notesGrid');
const query = document.getElementById('searchInput').value.trim().toLowerCase();
grid.innerHTML = '';
// 关键词筛选逻辑
const filtered = notes.filter(n => {
const matchTitle = n.title.toLowerCase().includes(query);
const matchContent = n.content.toLowerCase().includes(query);
const matchTags = (n.tags || []).some(t => t.toLowerCase().includes(query));
const matchRemark = (n.remark || '').toLowerCase().includes(query);
return matchTitle || matchContent || matchTags || matchRemark;
});
if (filtered.length === 0) {
grid.innerHTML = '<div class="empty-tip">暂无便利贴，点击右下角 “+” 创建</div>';
return;
}
filtered.forEach(note => {
const card = document.createElement('div');
card.className = 'note-card';
// 标签组生成
let tagsHtml = '';
if (note.tags && note.tags.length > 0) {
tagsHtml = `<div class="tags-row">${note.tags.map(t => `<span class="tag-badge">#${t}</span>`).join('')}</div>`;
}
// 备注生成（仅编辑过/不为空时才显示）
let remarkHtml = '';
if (note.remark && note.remark.trim() !== '') {
remarkHtml = `<div class="remark-badge">备注: ${escapeHtml(note.remark)}</div>`;
}
card.innerHTML = `
<div>
<div class="title">${escapeHtml(note.title || '无标题')}</div>
<div class="preview-content">${escapeHtml(note.content)}</div>
</div>
<div>
${tagsHtml}
${remarkHtml}
<div class="timestamps">
创: ${formatTime(note.createdAt)}<br>
修: ${formatTime(note.updatedAt)}
</div>
</div>
`;
// 点击查看详情
card.addEventListener('click', () => openViewer(note.id));
// 触摸屏长按设置/修改备注
card.addEventListener('touchstart', () => {
longPressTimer = setTimeout(() => {
promptSetRemark(note.id);
}, 600); // 长按 600ms 触发
}, { passive: true });
card.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
card.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });
grid.appendChild(card);
});
}
// 长按便签设置备注
function promptSetRemark(id) {
const note = notes.find(n => n.id === id);
if (!note) return;
const newRemark = prompt("修改/添加自定义备注 (留空表示不显示):", note.remark || "");
if (newRemark !== null) {
note.remark = newRemark.trim();
note.updatedAt = new Date().toISOString();
saveToLocalStorage();
renderNotes();
}
}
// 打开阅读展示模式 (解析 Markdown 格式)
function openViewer(id) {
currentNoteId = id;
const note = notes.find(n => n.id === id);
if (!note) return;
document.getElementById('viewTitle').innerText = note.title || '无标题';
document.getElementById('viewTimes').innerHTML = `创建时间：${formatTime(note.createdAt)} &nbsp;|&nbsp; 最后编辑：${formatTime(note.updatedAt)}`;
// 渲染标签
const tagsContainer = document.getElementById('viewTags');
tagsContainer.innerHTML = (note.tags || []).map(t => `<span class="tag-badge" style="background:#e0e7ff; color:#3730a3;">#${escapeHtml(t)}</span>`).join('');
// 渲染备注
const remarkEl = document.getElementById('viewRemark');
if (note.remark && note.remark.trim() !== '') {
remarkEl.style.display = 'inline-block';
remarkEl.innerText = `备注：${note.remark}`;
} else {
remarkEl.style.display = 'none';
}
// 轻量 Markdown 解析器实现
document.getElementById('viewContent').innerHTML = renderMarkdown(note.content);
document.getElementById('viewModal').classList.add('active');
}
// 打开编辑模式（新建或编辑）
function openEditor(id = null) {
currentNoteId = id;
if (id) {
const note = notes.find(n => n.id === id);
document.getElementById('editTitle').value = note.title || '';
document.getElementById('editContent').value = note.content || '';
document.getElementById('editTags').value = (note.tags || []).join(', ');
document.getElementById('editRemark').value = note.remark || '';
} else {
document.getElementById('editTitle').value = '';
document.getElementById('editContent').value = '';
document.getElementById('editTags').value = '';
document.getElementById('editRemark').value = '';
}
document.getElementById('editModal').classList.add('active');
}
function switchToEditMode() {
closeModal('viewModal');
openEditor(currentNoteId);
}
// 保存笔记
function saveNote() {
const title = document.getElementById('editTitle').value.trim();
const content = document.getElementById('editContent').value;
const tagsInput = document.getElementById('editTags').value;
const remark = document.getElementById('editRemark').value.trim();
if (!title && !content) {
alert('标题和内容不能同时为空！');
return;
}
// 解析标签
const tags = tagsInput.split(/[,，\s]+/).map(t => t.trim()).filter(t => t.length > 0);
const now = new Date().toISOString();
if (currentNoteId) {
// 更新已存在笔记
const note = notes.find(n => n.id === currentNoteId);
if (note) {
note.title = title;
note.content = content;
note.tags = tags;
note.remark = remark;
note.updatedAt = now;
}
} else {
// 创建新笔记
const newNote = {
id: 'note_' + Date.now(),
title: title,
content: content,
tags: tags,
remark: remark,
createdAt: now,
updatedAt: now
};
notes.unshift(newNote);
}
saveToLocalStorage();
closeModal('editModal');
renderNotes();
}
// 删除笔记
function deleteCurrentNote() {
if (!currentNoteId) return;
if (confirm('确定要删除这张便利贴吗？')) {
notes = notes.filter(n => n.id !== currentNoteId);
saveToLocalStorage();
closeModal('viewModal');
renderNotes();
}
}
// 工具栏快速插入 Markdown 语法
function insertMD(prefix, suffix = '') {
const textarea = document.getElementById('editContent');
const start = textarea.selectionStart;
const end = textarea.selectionEnd;
const text = textarea.value;
const selected = text.substring(start, end);
const replacement = prefix + selected + suffix;
textarea.value = text.substring(0, start) + replacement + text.substring(end);
textarea.focus();
textarea.setSelectionRange(start + prefix.length, end + prefix.length);
}
// 简单高效的 Markdown 文本解析器
function renderMarkdown(src) {
if (!src) return '<p style="color:#9ca3af;">(无内容)</p>';
let lines = src.split('\n');
let html = '';
let inList = false;
lines.forEach(line => {
let escaped = escapeHtml(line);
// 粗体转换
escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
// 标题 # 大标题 / ## 小标题
if (escaped.startsWith('# ')) {
if (inList) { html += '</ul>'; inList = false; }
html += `<h1>${escaped.replace('# ', '')}</h1>`;
} else if (escaped.startsWith('## ')) {
if (inList) { html += '</ul>'; inList = false; }
html += `<h2>${escaped.replace('## ', '')}</h2>`;
} else if (escaped.startsWith('- ')) {
if (!inList) { html += '<ul>'; inList = true; }
html += `<li>${escaped.replace('- ', '')}</li>`;
} else if (escaped.startsWith('&gt; ')) {
if (inList) { html += '</ul>'; inList = false; }
html += `<blockquote>${escaped.replace('&gt; ', '')}</blockquote>`;
} else {
if (inList) { html += '</ul>'; inList = false; }
if (escaped.trim() !== '') { html += `<p>${escaped}</p>`; }
}
});
if (inList) html += '</ul>';
return html;
}
// 基础辅助：转义 HTML 防止 XSS 攻击
function escapeHtml(str) {
return (str || '')
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}
function saveToLocalStorage() {
localStorage.setItem('mobile_md_notes', JSON.stringify(notes));
}
function closeModal(id) {
document.getElementById(id).classList.remove('active');
}
// 页面加载完毕初始化渲染
renderNotes();
</script>
</body>
</html>
