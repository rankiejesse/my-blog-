<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>便签</title>
<style>
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface2: #f9fafb;
  --border: #e5e7eb;
  --text: #111827;
  --text2: #374151;
  --text3: #6b7280;
  --text4: #9ca3af;
  --accent: #6366f1;
  --accent-soft: #e0e7ff;
  --danger: #ef4444;
  --danger-soft: rgba(239,68,68,0.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 14px;
  --note-y: #fef08a;
  --note-b: #bae6fd;
  --note-g: #bbf7d0;
  --note-p: #fbcfe8;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #162032;
  --border: #334155;
  --text: #f1f5f9;
  --text2: #cbd5e1;
  --text3: #94a3b8;
  --text4: #64748b;
  --accent: #818cf8;
  --accent-soft: #1e1b4b;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --note-y: #3d3500;
  --note-b: #0c2a3d;
  --note-g: #0a2e1a;
  --note-p: #3d0f22;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:88px; transition:background .2s,color .2s; }

/* ── 顶栏 ── */
header { position:sticky; top:0; background:var(--surface); padding:10px 14px; box-shadow:var(--shadow-sm); z-index:10; display:flex; gap:8px; align-items:center; }
.search-wrap { flex:1; position:relative; }
.search-box { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:20px; background:var(--surface2); font-size:15px; outline:none; color:var(--text); transition:border-color .15s,background .15s; }
.search-box:focus { border-color:var(--accent); background:var(--surface); }
.search-box::placeholder { color:var(--text4); }
.header-btn { background:none; border:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--text3); cursor:pointer; flex-shrink:0; transition:background .15s; }
.header-btn:active { background:var(--border); }

/* ── 排序栏 ── */
.sort-bar { display:flex; gap:6px; padding:10px 14px 4px; overflow-x:auto; }
.sort-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:5px 12px; font-size:12px; color:var(--text3); cursor:pointer; white-space:nowrap; transition:all .15s; }
.sort-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── 便利贴网格 ── */
.notes-grid { padding:10px 12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:11px; }
.note-card { border-radius:var(--radius); padding:13px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; justify-content:space-between; min-height:170px; cursor:pointer; position:relative; user-select:none; transition:transform .12s,box-shadow .12s; }
.note-card:active { transform:scale(0.97); box-shadow:none; }
.note-card[data-color="0"] { background:var(--note-y); }
.note-card[data-color="1"] { background:var(--note-b); }
.note-card[data-color="2"] { background:var(--note-g); }
.note-card[data-color="3"] { background:var(--note-p); }
.note-card .nc-title { font-weight:700; font-size:14px; margin-bottom:5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-card .nc-preview { font-size:12px; color:var(--text2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-all; flex:1; }
.note-card .nc-tags { margin-top:6px; display:flex; gap:3px; flex-wrap:wrap; overflow:hidden; max-height:20px; }
.tag-badge { background:rgba(255,255,255,0.55); font-size:10px; padding:2px 5px; border-radius:4px; color:var(--text2); }
[data-theme="dark"] .tag-badge { background:rgba(255,255,255,0.1); }
.remark-badge { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--danger-soft); color:var(--danger); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.note-card .nc-foot { margin-top:7px; font-size:9px; color:var(--text3); border-top:1px dashed rgba(0,0,0,0.1); padding-top:5px; }
[data-theme="dark"] .note-card .nc-foot { border-color:rgba(255,255,255,0.1); }
/* 左滑删除覆盖层 */
.swipe-del { position:absolute; inset:0; border-radius:var(--radius); background:var(--danger); display:flex; align-items:center; justify-content:flex-end; padding-right:20px; opacity:0; pointer-events:none; transition:opacity .15s; }
.swipe-del span { color:#fff; font-size:13px; font-weight:600; }

/* ── FAB ── */
.fab { position:fixed; bottom:24px; right:22px; width:54px; height:54px; background:var(--accent); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 8px 20px rgba(99,102,241,0.45); border:none; cursor:pointer; z-index:20; transition:transform .12s; }
.fab:active { transform:scale(0.9); }

/* ── 全屏弹窗 ── */
.modal { position:fixed; inset:0; background:var(--surface); z-index:30; display:none; flex-direction:column; }
.modal.active { display:flex; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface2); gap:8px; }
.modal-header button { background:none; border:none; font-size:15px; color:var(--accent); font-weight:600; cursor:pointer; padding:6px 8px; border-radius:8px; white-space:nowrap; }
.modal-header button:active { background:var(--accent-soft); }
.modal-header .btn-delete { color:var(--danger); }
.modal-body { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }

/* ── 编辑器 ── */
.editor-toolbar { display:flex; gap:5px; padding:8px 10px; background:var(--surface2); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap; }
.editor-toolbar button { background:var(--surface); border:1.5px solid var(--border); border-radius:7px; padding:6px 11px; font-size:13px; font-weight:500; color:var(--text2); cursor:pointer; flex-shrink:0; }
.editor-toolbar button:active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.editor-input { width:100%; border:none; outline:none; font-size:16px; background:transparent; color:var(--text); }
.editor-title-input { font-size:20px; font-weight:700; border-bottom:1px solid var(--border); padding:8px 0 10px; margin-bottom:12px; }
.editor-title-input::placeholder { color:var(--text4); }
.editor-textarea { width:100%; min-height:44vh; border:none; outline:none; resize:none; font-size:15px; line-height:1.75; font-family:ui-monospace,"SF Mono",monospace,sans-serif; background:transparent; color:var(--text); }
.editor-textarea::placeholder { color:var(--text4); }
.meta-fields { margin-top:12px; display:flex; flex-direction:column; gap:8px; background:var(--surface2); padding:12px; border-radius:10px; border:1px solid var(--border); }
.meta-fields input { padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; background:var(--surface); color:var(--text); outline:none; }
.meta-fields input:focus { border-color:var(--accent); }
.meta-fields input::placeholder { color:var(--text4); }
.word-count { font-size:11px; color:var(--text4); text-align:right; margin-top:4px; }

/* ── 查看模式 ── */
.view-title { font-size:22px; font-weight:700; color:var(--text); margin-bottom:5px; }
.view-time-info { font-size:11px; color:var(--text4); margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border); }
.view-tags { margin-bottom:10px; display:flex; gap:5px; flex-wrap:wrap; }
.view-tag { background:var(--accent-soft); color:var(--accent); font-size:11px; padding:3px 8px; border-radius:5px; }
.md-render h1 { font-size:20px; border-bottom:1px solid var(--border); padding-bottom:5px; margin:14px 0 8px; color:var(--text); }
.md-render h2 { font-size:17px; margin:10px 0 6px; color:var(--text); }
.md-render p { font-size:15px; line-height:1.65; margin-bottom:8px; color:var(--text2); }
.md-render blockquote { border-left:3px solid var(--accent); padding:6px 12px; color:var(--text3); margin:8px 0; background:var(--accent-soft); border-radius:0 6px 6px 0; }
.md-render ul { padding-left:20px; margin-bottom:8px; }
.md-render li { margin-bottom:4px; line-height:1.55; color:var(--text2); }
.md-render strong { color:var(--text); font-weight:700; }
.md-render code { background:var(--surface2); padding:1px 5px; border-radius:4px; font-family:ui-monospace,monospace; font-size:13px; color:var(--accent); border:1px solid var(--border); }
.md-render hr { border:none; border-top:1px solid var(--border); margin:12px 0; }

/* ── 导出菜单 ── */
.export-menu { position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; background:rgba(0,0,0,0.35); }
.export-menu.active { display:flex; }
.export-sheet { background:var(--surface); border-radius:20px 20px 0 0; padding:20px 16px 36px; width:100%; }
.export-sheet h3 { font-size:15px; font-weight:600; color:var(--text); margin-bottom:14px; text-align:center; }
.export-btn { width:100%; padding:14px; border:none; background:var(--surface2); border-radius:10px; font-size:15px; color:var(--text); cursor:pointer; margin-bottom:8px; text-align:left; display:flex; align-items:center; gap:10px; }
.export-btn:active { background:var(--border); }
.export-btn .icon { font-size:20px; width:28px; }
.export-cancel { width:100%; padding:14px; border:none; background:none; font-size:15px; color:var(--text3); cursor:pointer; margin-top:4px; }

/* ── 空状态 ── */
.empty-tip { text-align:center; color:var(--text4); margin-top:70px; font-size:14px; line-height:2; }
.empty-tip .emoji { font-size:40px; display:block; margin-bottom:8px; }

/* ── Toast ── */
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(10px); background:#1e293b; color:#f1f5f9; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .2s; z-index:99; white-space:nowrap; pointer-events:none; }
[data-theme="dark"] .toast { background:#f1f5f9; color:#1e293b; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-box" placeholder="搜索标题、内容、标签…" oninput="renderNotes()">
  </div>
  <button class="header-btn" onclick="toggleTheme()" id="themeBtn" title="切换夜间模式">🌙</button>
  <button class="header-btn" onclick="openExportMenu()" title="导出">⬆️</button>
</header>

<div class="sort-bar">
  <button class="sort-btn active" data-sort="updated" onclick="setSort('updated',this)">最近修改</button>
  <button class="sort-btn" data-sort="created" onclick="setSort('created',this)">最近创建</button>
  <button class="sort-btn" data-sort="title" onclick="setSort('title',this)">标题 A→Z</button>
</div>

<div id="notesGrid" class="notes-grid"></div>

<button class="fab" onclick="openEditor()">＋</button>

<!-- 查看弹窗 -->
<div id="viewModal" class="modal">
  <div class="modal-header">
    <button onclick="closeModal('viewModal')">◀ 返回</button>
    <div style="display:flex;gap:4px;">
      <button onclick="switchToEditMode()">编辑</button>
      <button class="btn-delete" onclick="deleteCurrentNote()">删除</button>
    </div>
  </div>
  <div class="modal-body">
    <div id="viewTitle" class="view-title"></div>
    <div id="viewTimes" class="view-time-info"></div>
    <div id="viewTags" class="view-tags"></div>
    <div id="viewRemark" style="display:none;" class="remark-badge" style="margin-bottom:10px;"></div>
    <div id="viewContent" class="md-render"></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="editModal" class="modal">
  <div class="modal-header">
    <button onclick="discardEdit()">取消</button>
    <span style="font-size:14px;color:var(--text3);font-weight:500;" id="editStatus"></span>
    <button onclick="saveNote()">保存</button>
  </div>
  <div class="editor-toolbar">
    <button onclick="insertMD('# ')">H1</button>
    <button onclick="insertMD('## ')">H2</button>
    <button onclick="insertMD('**','**')"><b>B</b></button>
    <button onclick="insertMD('`','`')">代码</button>
    <button onclick="insertMD('- ')">列表</button>
    <button onclick="insertMD('> ')">引用</button>
    <button onclick="insertMD('---\n')">分割线</button>
  </div>
  <div class="modal-body">
    <input type="text" id="editTitle" class="editor-input editor-title-input" placeholder="笔记标题…" oninput="markDirty()">
    <textarea id="editContent" class="editor-textarea" placeholder="支持 Markdown：**粗体** `代码` # 标题 - 列表 > 引用" oninput="onContentInput()"></textarea>
    <div class="word-count" id="wordCount">0 字</div>
    <div class="meta-fields">
      <input type="text" id="editTags" placeholder="标签（逗号或空格分隔）">
      <input type="text" id="editRemark" placeholder="备注（留空不显示）">
    </div>
  </div>
</div>

<!-- 导出菜单 -->
<div id="exportMenu" class="export-menu" onclick="closeExportMenu(event)">
  <div class="export-sheet">
    <h3>导出 / 备份</h3>
    <button class="export-btn" onclick="exportJSON()"><span class="icon">💾</span><div><div style="font-weight:600;">备份为 JSON</div><div style="font-size:12px;color:var(--text3);">可导入恢复全部数据</div></div></button>
    <button class="export-btn" onclick="exportAllMD()"><span class="icon">📄</span><div><div style="font-weight:600;">导出为 Markdown</div><div style="font-size:12px;color:var(--text3);">所有笔记合并为一个 .md 文件</div></div></button>
    <button class="export-btn" onclick="document.getElementById('importInput').click()"><span class="icon">📥</span><div><div style="font-weight:600;">从 JSON 导入</div><div style="font-size:12px;color:var(--text3);">恢复备份数据</div></div></button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
    <button class="export-cancel" onclick="closeExportMenu()">取消</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── 状态 ──
let notes = [];
let currentNoteId = null;
let sortMode = 'updated';
let isDirty = false;
let longPressTimer = null;
let swipeStartX = 0;
let swipeTarget = null;

// ── 初始化 ──
function init() {
  try { notes = JSON.parse(localStorage.getItem('mobile_md_notes_v2')) || []; }
  catch(e) { notes = []; }
  // 迁移旧数据
  const old = localStorage.getItem('mobile_md_notes');
  if (old && notes.length === 0) {
    try {
      notes = JSON.parse(old);
      save();
      showToast('已迁移旧版数据 ✓');
    } catch(e) {}
  }
  const theme = localStorage.getItem('theme') || 'light';
  setTheme(theme, false);
  renderNotes();
}

// ── 主题 ──
function setTheme(t, animate=true) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  if (animate) localStorage.setItem('theme', t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  setTheme(next);
  localStorage.setItem('theme', next);
}

// ── 排序 ──
function setSort(mode, btn) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNotes();
}
function getSorted(arr) {
  return [...arr].sort((a,b) => {
    if (sortMode === 'updated') return new Date(b.updatedAt) - new Date(a.updatedAt);
    if (sortMode === 'created') return new Date(b.createdAt) - new Date(a.createdAt);
    if (sortMode === 'title') return (a.title||'').localeCompare(b.title||'', 'zh');
    return 0;
  });
}

// ── 渲染卡片 ──
const COLORS = ['0','1','2','3'];
function renderNotes() {
  const grid = document.getElementById('notesGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = notes.filter(n => {
    if (!q) return true;
    return n.title.toLowerCase().includes(q)
      || n.content.toLowerCase().includes(q)
      || (n.tags||[]).some(t => t.toLowerCase().includes(q))
      || (n.remark||'').toLowerCase().includes(q);
  });
  filtered = getSorted(filtered);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-tip"><span class="emoji">${q ? '🔍' : '🗒️'}</span>${q ? '没有匹配的便利贴' : '还没有便利贴<br>点右下角 ＋ 新建'}</div>`;
    return;
  }
  grid.innerHTML = '';
  filtered.forEach((note, idx) => {
    const color = COLORS[idx % 4];
    const card = document.createElement('div');
    card.className = 'note-card';
    card.dataset.color = color;
    card.dataset.id = note.id;

    const tagsHtml = (note.tags||[]).length
      ? `<div class="nc-tags">${note.tags.map(t=>`<span class="tag-badge">#${esc(t)}</span>`).join('')}</div>` : '';
    const remarkHtml = note.remark?.trim()
      ? `<div class="remark-badge">📌 ${esc(note.remark)}</div>` : '';

    card.innerHTML = `
      <div class="swipe-del"><span>🗑️ 删除</span></div>
      <div>
        <div class="nc-title">${esc(note.title||'无标题')}</div>
        <div class="nc-preview">${esc(note.content)}</div>
      </div>
      <div>
        ${tagsHtml}
        ${remarkHtml}
        <div class="nc-foot">创: ${formatTime(note.createdAt)}<br>修: ${formatTime(note.updatedAt)}</div>
      </div>`;

    card.addEventListener('click', () => openViewer(note.id));
    // 长按设置备注
    card.addEventListener('touchstart', e => {
      longPressTimer = setTimeout(() => { promptSetRemark(note.id); }, 650);
    }, { passive:true });
    card.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive:true });
    card.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive:true });
    // 左滑删除
    setupSwipe(card, note.id);
    grid.appendChild(card);
  });
}

// ── 左滑删除 ──
function setupSwipe(card, id) {
  let startX = 0, startY = 0, moved = false;
  const del = card.querySelector('.swipe-del');
  card.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
  }, { passive:true });
  card.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > Math.abs(dx)) return;
    moved = true;
    if (dx < 0) {
      const pct = Math.min(Math.abs(dx) / 100, 1);
      del.style.opacity = pct;
      card.style.transform = `translateX(${dx}px)`;
      clearTimeout(longPressTimer);
    }
  }, { passive:true });
  card.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (moved && dx < -80) {
      if (confirm('删除这张便利贴？')) {
        notes = notes.filter(n => n.id !== id);
        save(); renderNotes();
      } else {
        card.style.transform = '';
        del.style.opacity = 0;
      }
    } else {
      card.style.transform = '';
      del.style.opacity = 0;
    }
  }, { passive:true });
}

// ── 查看 ──
function openViewer(id) {
  currentNoteId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;
  document.getElementById('viewTitle').textContent = note.title || '无标题';
  document.getElementById('viewTimes').innerHTML = `创建 ${formatTime(note.createdAt)} &nbsp;·&nbsp; 修改 ${formatTime(note.updatedAt)}`;
  document.getElementById('viewTags').innerHTML = (note.tags||[]).map(t=>`<span class="view-tag">#${esc(t)}</span>`).join('');
  const rem = document.getElementById('viewRemark');
  if (note.remark?.trim()) { rem.style.display='inline-block'; rem.textContent=`📌 ${note.remark}`; }
  else rem.style.display='none';
  document.getElementById('viewContent').innerHTML = renderMD(note.content);
  document.getElementById('viewModal').classList.add('active');
}

// ── 编辑 ──
function openEditor(id=null) {
  currentNoteId = id;
  isDirty = false;
  if (id) {
    const n = notes.find(n=>n.id===id);
    document.getElementById('editTitle').value = n.title||'';
    document.getElementById('editContent').value = n.content||'';
    document.getElementById('editTags').value = (n.tags||[]).join(', ');
    document.getElementById('editRemark').value = n.remark||'';
  } else {
    document.getElementById('editTitle').value = '';
    document.getElementById('editContent').value = '';
    document.getElementById('editTags').value = '';
    document.getElementById('editRemark').value = '';
  }
  updateWordCount();
  document.getElementById('editStatus').textContent = '';
  document.getElementById('editModal').classList.add('active');
  setTimeout(()=>document.getElementById('editTitle').focus(), 100);
}
function switchToEditMode() { closeModal('viewModal'); openEditor(currentNoteId); }
function markDirty() { isDirty = true; document.getElementById('editStatus').textContent = '未保存'; }
function onContentInput() { markDirty(); updateWordCount(); }
function updateWordCount() {
  const len = document.getElementById('editContent').value.length;
  document.getElementById('wordCount').textContent = `${len} 字`;
}
function discardEdit() {
  if (isDirty && !confirm('放弃未保存的更改？')) return;
  closeModal('editModal');
}

// ── 保存 ──
function saveNote() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value;
  const tags = document.getElementById('editTags').value.split(/[,，\s]+/).map(t=>t.trim()).filter(Boolean);
  const remark = document.getElementById('editRemark').value.trim();
  if (!title && !content) { showToast('标题和内容不能同时为空'); return; }
  const now = new Date().toISOString();
  if (currentNoteId) {
    const n = notes.find(n=>n.id===currentNoteId);
    if (n) { n.title=title; n.content=content; n.tags=tags; n.remark=remark; n.updatedAt=now; }
  } else {
    notes.unshift({ id:'note_'+Date.now(), title, content, tags, remark, createdAt:now, updatedAt:now });
  }
  save(); isDirty=false;
  closeModal('editModal');
  renderNotes();
  showToast('已保存 ✓');
}

// ── 删除 ──
function deleteCurrentNote() {
  if (!currentNoteId) return;
  if (confirm('确定删除这张便利贴？')) {
    notes = notes.filter(n=>n.id!==currentNoteId);
    save(); closeModal('viewModal'); renderNotes();
    showToast('已删除');
  }
}

// ── 长按备注 ──
function promptSetRemark(id) {
  const note = notes.find(n=>n.id===id);
  if (!note) return;
  const r = prompt('修改备注（留空则不显示）:', note.remark||'');
  if (r !== null) { note.remark=r.trim(); note.updatedAt=new Date().toISOString(); save(); renderNotes(); }
}

// ── 导出 / 导入 ──
function openExportMenu() { document.getElementById('exportMenu').classList.add('active'); }
function closeExportMenu(e) {
  if (!e || e.target === document.getElementById('exportMenu')) document.getElementById('exportMenu').classList.remove('active');
}
function exportJSON() {
  const data = JSON.stringify(notes, null, 2);
  downloadFile(`便签备份_${dateStr()}.json`, data, 'application/json');
  closeExportMenu();
}
function exportAllMD() {
  const md = getSorted(notes).map(n =>
    `# ${n.title||'无标题'}\n\n> 创建：${formatTime(n.createdAt)} | 修改：${formatTime(n.updatedAt)}\n\n${n.content}\n\n---\n`
  ).join('\n');
  downloadFile(`便签导出_${dateStr()}.md`, md, 'text/markdown');
  closeExportMenu();
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error();
      const ids = new Set(notes.map(n=>n.id));
      let added = 0;
      imported.forEach(n => { if (!ids.has(n.id)) { notes.unshift(n); added++; } });
      save(); renderNotes();
      showToast(`导入成功，新增 ${added} 条 ✓`);
    } catch { showToast('文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
  closeExportMenu();
}
function downloadFile(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click();
}
function dateStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

// ── 工具栏插入 MD ──
function insertMD(prefix, suffix='') {
  const ta = document.getElementById('editContent');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s,e);
  ta.value = ta.value.substring(0,s) + prefix + sel + suffix + ta.value.substring(e);
  ta.focus(); ta.setSelectionRange(s+prefix.length, e+prefix.length);
  markDirty(); updateWordCount();
}

// ── Markdown 渲染 ──
function renderMD(src) {
  if (!src) return '<p style="color:var(--text4)">(无内容)</p>';
  let html = '';
  let inList = false;
  src.split('\n').forEach(line => {
    // 先处理行内元素，再 escape
    let e = esc(line);
    // 粗体
    e = e.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // 行内代码
    e = e.replace(/`(.*?)`/g, '<code>$1</code>');
    if (e.startsWith('# ')) {
      if (inList) { html += '</ul>'; inList=false; }
      html += `<h1>${e.slice(2)}</h1>`;
    } else if (e.startsWith('## ')) {
      if (inList) { html += '</ul>'; inList=false; }
      html += `<h2>${e.slice(3)}</h2>`;
    } else if (e.startsWith('- ')) {
      if (!inList) { html += '<ul>'; inList=true; }
      html += `<li>${e.slice(2)}</li>`;
    } else if (e.startsWith('&gt; ')) {
      if (inList) { html += '</ul>'; inList=false; }
      html += `<blockquote>${e.slice(5)}</blockquote>`;
    } else if (e.trim() === '---') {
      if (inList) { html += '</ul>'; inList=false; }
      html += '<hr>';
    } else {
      if (inList) { html += '</ul>'; inList=false; }
      if (e.trim()) html += `<p>${e}</p>`;
    }
  });
  if (inList) html += '</ul>';
  return html;
}

// ── 工具函数 ──
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTime(d) {
  const t = new Date(d);
  return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}
function save() { localStorage.setItem('mobile_md_notes_v2', JSON.stringify(notes)); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

init();
</script>
