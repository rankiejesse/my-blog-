<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正态分布图 (Normal Distribution)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--subtext-color);
        }

        .chart-container {
            width: 100%;
            margin: 20px 0;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .formula-box {
            margin-top: 20px;
            padding: 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            border-left: 4px solid var(--accent-color);
            text-align: center;
        }

        .formula {
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            font-style: italic;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .formula-desc {
            font-size: 12px;
            color: var(--subtext-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--subtext-color);
            margin-top: 4px;
        }

        /* 播放按钮样式 (右下角) */
        .play-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            outline: none;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 字幕弹幕容器与样式 */
        .subtitle-box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 99;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        .subtitle-box.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>正态分布曲线 (Normal Distribution)</h1>
            <p class="subtitle">高斯分布概率密度函数图形展示 · μ = 0, σ = 1</p>
        </header>

        <div class="chart-container">
            <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <line x1="100" y1="320" x2="700" y2="320" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                <line x1="100" y1="240" x2="700" y2="240" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4"/>
                <line x1="100" y1="160" x2="700" y2="160" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>
                <line x1="100" y1="80" x2="700" y2="80" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>

                <line x1="250" y1="320" x2="250" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="325" y1="320" x2="325" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="400" y1="320" x2="400" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="475" y1="320" x2="475" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="550" y1="320" x2="550" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

                <path d="M 100 320 
                         C 200 320, 220 315, 250 280 
                         C 280 240, 310 180, 350 100 
                         C 380 40, 390 40, 400 40 
                         C 410 40, 420 40, 450 100 
                         C 490 180, 520 240, 550 280 
                         C 580 315, 600 320, 700 320 
                         Z" 
                      fill="url(#curveGradient)" />

                <path d="M 100 320 
                         C 200 320, 220 315, 250 280 
                         C 280 240, 310 180, 350 100 
                         C 380 40, 390 40, 400 40 
                         C 410 40, 420 40, 450 100 
                         C 490 180, 520 240, 550 280 
                         C 580 315, 600 320, 700 320" 
                      fill="none" 
                      stroke="#38bdf8" 
                      stroke-width="3.5" 
                      filter="url(#glow)"/>

                <line x1="80" y1="320" x2="720" y2="320" stroke="#cbd5e1" stroke-width="2"/>

                <text x="400" y="345" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">μ (0)</text>
                <text x="475" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+1σ</text>
                <text x="550" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+2σ</text>
                <text x="625" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+3σ</text>
                <text x="325" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-1σ</text>
                <text x="250" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-2σ</text>
                <text x="175" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-3σ</text>

                <text x="400" y="180" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="bold">68.27%</text>
                <text x="400" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">(±1σ 范围)</text>
            </svg>
        </div>

        <div class="formula-box">
            <div class="formula">
                f(x) = (1 / (σ √(2π))) · e<sup>-[ (x - μ)² / (2σ²) ]</sup>
            </div>
            <div class="formula-desc">
                正态分布（高斯分布）概率密度函数公式
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">68.27%</div>
                <div class="stat-label">落在 [μ-σ, μ+σ]</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">95.45%</div>
                <div class="stat-label">落在 [μ-2σ, μ+2σ]</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">99.73%</div>
                <div class="stat-label">落在 [μ-3σ, μ+3σ]</div>
            </div>
        </div>
    </div>

    <!-- 播放按钮 -->
    <button class="play-btn" id="playBtn" title="播放字幕">▶</button>

    <!-- 字幕容器 -->
    <div class="subtitle-box" id="subtitleBox"></div>

    <script>
        const subtitles = [
            "隔壁班新转来一个正太，他靠扭腰吸引了很多妹子，我们都扭不过他",
            "可我早就不扭了",
            "嫂子也在！！！",
            "什么⁉把我的领带拿来"
        ];

        const playBtn = document.getElementById('playBtn');
        const subtitleBox = document.getElementById('subtitleBox');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('disabled');

            let index = 0;

            function showNextSubtitle() {
                if (index < subtitles.length) {
                    subtitleBox.textContent = subtitles[index];
                    subtitleBox.classList.add('show');

                    // 每条存在 2 秒 (2000 ms)
                    setTimeout(() => {
                        subtitleBox.classList.remove('show');
                        index++;
                        // 前一条完全消失后再展示下一条 (间隔 300ms)
                        setTimeout(showNextSubtitle, 300);
                    }, 2000);
                } else {
                    isPlaying = false;
                    playBtn.classList.remove('disabled');
                }
            }

            showNextSubtitle();
        });
    </script>
</body>
</html>
