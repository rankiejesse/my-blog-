<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 手机触屏版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden; /* 防止滑动时页面整体滚动 */
        }

        .header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #776e65;
        }

        .scores-container {
            display: flex;
            gap: 8px;
        }

        .score-box {
            background: #bbada0;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-align: center;
            min-width: 65px;
        }

        .score-box label {
            display: block;
            font-size: 10px;
            color: #eee4da;
            text-transform: uppercase;
        }

        .score-box span {
            font-size: 16px;
            font-weight: bold;
        }

        .controls {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* 棋盘：适配手机屏幕宽度 */
        .grid-container {
            width: 90vw;
            height: 90vw;
            max-width: 380px;
            max-height: 380px;
            background: #bbada0;
            border-radius: 8px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            position: relative;
            touch-action: none; /* 关键：禁止浏览器默认滑动动作 */
        }

        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            transition: all 0.1s ease-in-out;
        }

        /* 不同数值的色彩和字号适配 */
        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .cell[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 22px; }
        .cell[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 22px; }
        .cell[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 22px; }
        .cell[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 18px; }
        .cell[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 18px; }

        .tips {
            margin-top: 15px;
            font-size: 13px;
            color: #776e65;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="title">2048</div>
    <div class="scores-container">
        <div class="score-box">
            <label>SCORE</label>
            <span id="score">0</span>
        </div>
        <div class="score-box">
            <label>BEST</label>
            <span id="best">0</span>
        </div>
    </div>
</div>

<div class="controls">
    <span>合并数字拼出 <strong>2048</strong>！</span>
    <button class="btn" onclick="restartGame()">新游戏</button>
</div>

<div class="grid-container" id="grid"></div>

<div class="tips">手指在棋盘区域 <strong>上下左右滑动</strong> 即可操作</div>

<script>
    const GRID_SIZE = 4;
    const gridEl = document.getElementById("grid");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem("2048_touch_best")) || 0;

    bestEl.innerText = bestScore;

    function createGrid() {
        gridEl.innerHTML = "";
        for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            gridEl.appendChild(cell);
        }
    }

    function init() {
        createGrid();
        const savedState = JSON.parse(localStorage.getItem("2048_touch_state"));
        
        if (savedState && savedState.board) {
            board = savedState.board;
            score = savedState.score || 0;
        } else {
            resetBoard();
        }
        updateView();
    }

    function resetBoard() {
        board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
        score = 0;
        addRandomTile();
        addRandomTile();
        saveState();
    }

    function restartGame() {
        resetBoard();
        updateView();
    }

    function addRandomTile() {
        const emptyCells = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (board[r][c] === 0) emptyCells.push({ r, c });
            }
        }
        if (emptyCells.length > 0) {
            const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
    }

    function updateView() {
        const cells = gridEl.querySelectorAll(".cell");
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const val = board[r][c];
                const cell = cells[r * GRID_SIZE + c];
                cell.innerText = val > 0 ? val : "";
                cell.setAttribute("data-value", val);
            }
        }
        scoreEl.innerText = score;
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
            localStorage.setItem("2048_touch_best", bestScore);
        }
    }

    function saveState() {
        localStorage.setItem("2048_touch_state", JSON.stringify({ board, score }));
    }

    function slide(row) {
        let arr = row.filter(val => val !== 0);
        for (let i = 0; i < arr.length - 1; i++) {
            if (arr[i] === arr[i + 1]) {
                arr[i] *= 2;
                score += arr[i];
                arr[i + 1] = 0;
            }
        }
        arr = arr.filter(val => val !== 0);
        while (arr.length < GRID_SIZE) arr.push(0);
        return arr;
    }

    function move(dir) {
        let prevBoard = JSON.stringify(board);

        if (dir === "left" || dir === "right") {
            for (let r = 0; r < GRID_SIZE; r++) {
                let row = board[r];
                if (dir === "right") row.reverse();
                let newRow = slide(row);
                if (dir === "right") newRow.reverse();
                board[r] = newRow;
            }
        } else {
            for (let c = 0; c < GRID_SIZE; c++) {
                let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                if (dir === "down") col.reverse();
                let newCol = slide(col);
                if (dir === "down") newCol.reverse();
                for (let r = 0; r < GRID_SIZE; r++) {
                    board[r][c] = newCol[r];
                }
            }
        }

        if (JSON.stringify(board) !== prevBoard) {
            addRandomTile();
            saveState();
            updateView();
            checkGameOver();
        }
    }

    function checkGameOver() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (board[r][c] === 0) return;
                if (c < GRID_SIZE - 1 && board[r][c] === board[r][c + 1]) return;
                if (r < GRID_SIZE - 1 && board[r][c] === board[r + 1][c]) return;
            }
        }
        setTimeout(() => alert("游戏结束！无法继续移动。"), 100);
    }

    // 触摸手势监听逻辑
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    gridEl.addEventListener("touchstart", e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    gridEl.addEventListener("touchend", e => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        const minDistance = 30; // 触发滑动的最小像素距离

        if (Math.abs(dx) > Math.abs(dy)) {
            // 水平滑动
            if (Math.abs(dx) > minDistance) {
                if (dx > 0) move("right");
                else move("left");
            }
        } else {
            // 垂直滑动
            if (Math.abs(dy) > minDistance) {
                if (dy > 0) move("down");
                else move("up");
            }
        }
    }

    // 兼容键盘操作（在电脑端打开时也能用）
    document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") move("left");
        else if (e.key === "ArrowRight") move("right");
        else if (e.key === "ArrowUp") move("up");
        else if (e.key === "ArrowDown") move("down");
    });

    init();
</script>
</body>
</html>
