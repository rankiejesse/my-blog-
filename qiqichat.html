<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI IM Companion System</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --sidebar-bg: #e3e3e8;
            --card-bg: #ffffff;
            --primary-color: #007aff;
            --danger-color: #ff3b30;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-color: #e5e5ea;
            --chat-bubble-user: #007aff;
            --chat-bubble-ai: #e9e9eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-primary); overflow: hidden; }

        /* 主侧边导航 - 支持收起 */
        .sidebar { width: 70px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-right: 1px solid var(--border-color); transition: width 0.3s ease; position: relative; flex-shrink: 0; }
        .sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border: none; }
        .nav-item { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; cursor: pointer; transition: all 0.2s; font-size: 20px; }
        .nav-item:hover, .nav-item.active { background-color: var(--card-bg); color: var(--primary-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* 折叠/展开控制按钮 */
        .toggle-btn { position: absolute; bottom: 20px; cursor: pointer; background: var(--card-bg); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); font-size: 12px; z-index: 100; border: 1px solid var(--border-color); }

        /* 主内容区 */
        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        .panel { display: none; width: 100%; height: 100%; }
        .panel.active { display: flex; }

        /* 顶部状态栏（天气与时间） */
        .status-bar { height: 44px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 13px; color: var(--text-secondary); }

        /* 通用子列表与详情分栏 - 支持折叠 */
        .sub-sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: width 0.3s ease; flex-shrink: 0; }
        .sub-sidebar.collapsed { width: 0; overflow: hidden; border: none; }
        .sub-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; display: flex; justify-content: space-between; align-items: center; min-width: 260px; }
        .item-list { flex: 1; overflow-y: auto; min-width: 260px; }
        .list-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .list-item:hover, .list-item.active { background-color: #f0f0f5; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background-size: cover; flex-shrink: 0; }

        .content-area { flex: 1; display: flex; flex-direction: column; background: var(--card-bg); overflow: hidden; }

        /* 消息模块专项样式 */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f9f9fb; }
        .message-row { display: flex; gap: 10px; max-width: 75%; align-items: flex-end; position: relative; }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; position: relative; user-select: text; word-break: break-word; }
        .message-row.ai .message-bubble { background: var(--chat-bubble-ai); color: var(--text-primary); border-top-left-radius: 4px; }
        .message-row.user .message-bubble { background: var(--chat-bubble-user); color: white; border-top-right-radius: 4px; }

        /* 显式消息删除按钮 */
        .msg-del-btn { display: none; cursor: pointer; color: var(--danger-color); font-size: 12px; padding: 4px; background: rgba(0,0,0,0.05); border-radius: 4px; border: none; }
        .message-row:hover .msg-del-btn { display: block; }

        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--card-bg); }
        .chat-input { flex: 1; border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 15px; outline: none; font-size: 14px; }
        .btn { padding: 6px 14px; border-radius: 18px; border: none; background: var(--primary-color); color: white; cursor: pointer; font-weight: 500; font-size: 13px; }
        .btn:hover { opacity: 0.9; }
        .btn-icon { background: transparent; color: var(--text-secondary); padding: 4px 8px; font-size: 14px; }

        /* 表单与设置面板 */
        .form-container { padding: 20px; overflow-y: auto; flex: 1; max-width: 800px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
        textarea.form-control { resize: vertical; min-height: 80px; }
    </style>
</head>
<body>

    <!-- 主侧边导航栏 -->
    <div class="sidebar" id="main-sidebar">
        <div class="nav-item active" onclick="switchTab('chat')" title="消息">💬</div>
        <div class="nav-item" onclick="switchTab('contacts')" title="联系人">👤</div>
        <div class="nav-item" onclick="switchTab('persona')" title="自设">🎭</div>
        <div class="nav-item" onclick="switchTab('worldbook')" title="世界书">📚</div>
        <div class="nav-item" onclick="switchTab('settings')" title="设置">⚙️</div>
        <div class="nav-item" onclick="switchTab('other')" title="其他">🧩</div>

        <div class="toggle-btn" onclick="toggleMainSidebar()" title="折叠/展开主菜单">◄</div>
    </div>

    <!-- 主窗口区 -->
    <div class="main-container">

        <!-- 1. 消息模块 -->
        <div id="panel-chat" class="panel active">
            <div class="sub-sidebar" id="sub-sidebar-chat">
                <div class="sub-header">
                    <span>消息列表</span>
                    <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-chat')" title="收起列表">◀</button>
                </div>
                <div class="item-list" id="chat-list"></div>
            </div>
            <div class="content-area">
                <div class="status-bar">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-chat')" title="展开/收起列表">☰ 列表</button>
                        <span id="current-time">系统时间: --:--:--</span>
                    </div>
                    <div>
                        <span id="current-weather" style="margin-right:15px">🌤️ 晴 24°C</span>
                        <button class="btn" style="background:var(--danger-color); font-size:12px;" onclick="clearCurrentChatHistory()">清空聊天记录</button>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chat-input" placeholder="发送消息..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="btn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>

        <!-- 2. 联系人模块 -->
        <div id="panel-contacts" class="panel">
            <div class="sub-sidebar" id="sub-sidebar-contacts">
                <div class="sub-header">
                    <span>联系人</span>
                    <div>
                        <button class="btn" style="padding:4px 8px; font-size:12px" onclick="addNewContact()">+ 新建</button>
                        <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-contacts')" title="收起列表">◀</button>
                    </div>
                </div>
                <div class="item-list" id="contact-list"></div>
            </div>
            <div class="content-area">
                <div class="status-bar">
                    <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-contacts')">☰ 列表</button>
                </div>
                <div class="form-container" id="contact-detail">
                    <h3>联系人配置</h3><br>
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" class="form-control" id="c-name" onchange="saveCurrentContact()">
                    </div>
                    <div class="form-group">
                        <label>人设 Prompt (System Prompt)</label>
                        <textarea class="form-control" id="c-prompt" onchange="saveCurrentContact()"></textarea>
                    </div>
                    <div class="form-group">
                        <label>绑定用户自设身份 (User Persona)</label>
                        <select class="form-control" id="c-persona" onchange="saveCurrentContact()"></select>
                    </div>
                    <div class="form-group">
                        <label>挂载世界书 (按 Ctrl/Cmd 可多选)</label>
                        <select class="form-control" id="c-worldbooks" multiple onchange="saveCurrentContact()"></select>
                    </div>
                    <div class="form-group">
                        <button class="btn" style="background:var(--danger-color)" onclick="deleteCurrentContact()">删除此联系人</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 自设模块 -->
        <div id="panel-persona" class="panel">
            <div class="sub-sidebar" id="sub-sidebar-persona">
                <div class="sub-header">
                    <span>用户自设列表</span>
                    <div>
                        <button class="btn" style="padding:4px 8px; font-size:12px" onclick="addNewPersona()">+ 新建</button>
                        <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-persona')">◀</button>
                    </div>
                </div>
                <div class="item-list" id="persona-list"></div>
            </div>
            <div class="content-area">
                <div class="status-bar">
                    <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-persona')">☰ 列表</button>
                </div>
                <div class="form-container">
                    <h3>自设档案编辑</h3><br>
                    <div class="form-group">
                        <label>身份标签/名称</label>
                        <input type="text" class="form-control" id="p-title" onchange="saveCurrentPersona()">
                    </div>
                    <div class="form-group">
                        <label>详细描述（外貌、性格、人际关系等）</label>
                        <textarea class="form-control" id="p-desc" style="height: 150px;" onchange="saveCurrentPersona()"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. 世界书模块 -->
        <div id="panel-worldbook" class="panel">
            <div class="sub-sidebar" id="sub-sidebar-wb">
                <div class="sub-header">
                    <span>世界书词典</span>
                    <div>
                        <button class="btn" style="padding:4px 8px; font-size:12px" onclick="addNewWorldbookEntry()">+ 新词条</button>
                        <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-wb')">◀</button>
                    </div>
                </div>
                <div class="item-list" id="worldbook-list"></div>
            </div>
            <div class="content-area">
                <div class="status-bar">
                    <button class="btn btn-icon" onclick="toggleSubSidebar('sub-sidebar-wb')">☰ 列表</button>
                </div>
                <div class="form-container">
                    <h3>词条深度配置（仅命中关键词时吃进上下文）</h3><br>
                    <div class="form-group">
                        <label>触发关键词（逗号分隔）</label>
                        <input type="text" class="form-control" id="wb-keys" placeholder="例如: 魔法, 学院" onchange="saveCurrentWB()">
                    </div>
                    <div class="form-group">
                        <label>设定条目内容</label>
                        <textarea class="form-control" id="wb-content" style="height: 200px;" onchange="saveCurrentWB()"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. 设置模块 -->
        <div id="panel-settings" class="panel">
            <div class="content-area">
                <div class="form-container">
                    <h2>系统与 API 设置</h2><br>
                    <div class="form-group">
                        <label>API Base URL</label>
                        <input type="text" class="form-control" id="cfg-url" value="https://api.openai.com/v1">
                    </div>
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="password" class="form-control" id="cfg-key" value="sk-xxxxxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>选择/自定义模型</label>
                        <input type="text" class="form-control" id="cfg-model" value="gpt-4o">
                    </div>
                    <hr style="margin:20px 0; border:none; border-top:1px solid var(--border-color)"><br>
                    <h2>数据备份（防丢失）</h2><br>
                    <button class="btn" onclick="exportData()">导出全量配置文件 (JSON)</button>
                    <button class="btn" style="background:#34c759" onclick="document.getElementById('import-file').click()">导入配置文件</button>
                    <input type="file" id="import-file" style="display:none" onchange="importData(event)">
                </div>
            </div>
        </div>

        <!-- 6. 其他模块 -->
        <div id="panel-other" class="panel">
            <div class="content-area">
                <div class="form-container">
                    <h2>扩展缓冲区</h2><br>
                    <p style="color:var(--text-secondary)">预留用于未来不破坏整体 UI 的插件扩展、皮肤切换或实验性功能。</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let appData = {
            contacts: [
                { id: 'c1', name: '夏鸣星', prompt: '你是夏鸣星，性格有些黏人且占有欲强。', personaId: 'p1', worldbooks: ['wb1'], history: [
                    { sender: 'ai', text: '你今天过得怎么样？有想我吗？' }
                ] }
            ],
            personas: [
                { id: 'p1', title: '主身份', desc: '一名喜欢热牛奶、爱吃辣的大学生。' }
            ],
            worldbooks: [
                { id: 'wb1', keys: '汤圆, 贴贴', content: '【专属昵称】夏鸣星有时会亲切地称呼对方。' }
            ]
        };

        let currentActiveContactId = 'c1';
        let currentActivePersonaId = 'p1';
        let currentActiveWBId = 'wb1';

        window.onload = () => {
            updateClock();
            setInterval(updateClock, 1000);
            renderAll();
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = `系统时间: ${now.toLocaleTimeString()}`;
        }

        /* ----- 栏目折叠/展开逻辑 ----- */
        function toggleMainSidebar() {
            const sidebar = document.getElementById('main-sidebar');
            const btn = document.querySelector('.toggle-btn');
            sidebar.classList.toggle('collapsed');
            btn.innerText = sidebar.classList.contains('collapsed') ? '►' : '◄';
        }

        function toggleSubSidebar(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('collapsed');
        }

        /* ----- 视图切换 ----- */
        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(`panel-${tabName}`).classList.add('active');
            renderAll();
        }

        function renderAll() {
            renderChatList();
            renderChatMessages();
            renderContactList();
            renderPersonaList();
            renderWorldbookList();
        }

        /* ----- 消息模块与显式删除按钮 ----- */
        function renderChatList() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            appData.contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = `list-item ${c.id === currentActiveContactId ? 'active' : ''}`;
                item.onclick = () => { currentActiveContactId = c.id; renderAll(); };
                const lastMsg = c.history.length > 0 ? c.history[c.history.length - 1].text : '暂无消息';
                item.innerHTML = `
                    <div class="avatar" style="background-color:#007aff">${c.name[0]}</div>
                    <div style="flex:1; overflow:hidden;">
                        <div style="font-weight:600">${c.name}</div>
                        <div style="font-size:12px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${lastMsg}</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const contact = appData.contacts.find(c => c.id === currentActiveContactId);
            if (!contact) return;

            contact.history.forEach((msg, idx) => {
                const row = document.createElement('div');
                row.className = `message-row ${msg.sender}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.innerText = msg.text;

                // 显式删除按键（鼠标悬停在气泡上即可看到小垃圾桶按钮）
                const delBtn = document.createElement('button');
                delBtn.className = 'msg-del-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.title = '删除此条消息';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSingleMessage(idx);
                };

                row.appendChild(bubble);
                row.appendChild(delBtn);
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }

        function deleteSingleMessage(index) {
            const contact = appData.contacts.find(c => c.id === currentActiveContactId);
            if (contact) {
                contact.history.splice(index, 1);
                renderChatMessages();
                renderChatList();
            }
        }

        function clearCurrentChatHistory() {
            if (confirm("确定要清空与当前联系人的全部聊天记录吗？")) {
                const c = appData.contacts.find(c => c.id === currentActiveContactId);
                if (c) { c.history = []; renderChatMessages(); renderChatList(); }
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const contact = appData.contacts.find(c => c.id === currentActiveContactId);
            contact.history.push({ sender: 'user', text });
            input.value = '';
            renderChatMessages();

            setTimeout(() => {
                simulateAiResponse(contact);
            }, 800);
        }

        function simulateAiResponse(contact) {
            const rawAiResponse = `收到！\n\n那我们待会儿见。`;
            const splitRegex = /\n\n+/;
            const segments = rawAiResponse.split(splitRegex);

            segments.forEach((seg, index) => {
                setTimeout(() => {
                    contact.history.push({ sender: 'ai', text: seg });
                    renderChatMessages();
                    renderChatList();
                }, index * 1000);
            });
        }

        /* ----- 联系人配置逻辑 ----- */
        function renderContactList() {
            const listEl = document.getElementById('contact-list');
            listEl.innerHTML = '';
            appData.contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = `list-item ${c.id === currentActiveContactId ? 'active' : ''}`;
                item.onclick = () => { currentActiveContactId = c.id; renderContactList(); loadContactDetail(); };
                item.innerHTML = `<div class="avatar" style="background-color:#5856d6">${c.name[0]}</div><div style="font-weight:600">${c.name}</div>`;
                listEl.appendChild(item);
            });
            loadContactDetail();
        }

        function loadContactDetail() {
            const c = appData.contacts.find(c => c.id === currentActiveContactId);
            if (!c) return;
            document.getElementById('c-name').value = c.name;
            document.getElementById('c-prompt').value = c.prompt;

            const pSelect = document.getElementById('c-persona');
            pSelect.innerHTML = '';
            appData.personas.forEach(p => {
                pSelect.innerHTML += `<option value="${p.id}" ${p.id === c.personaId ? 'selected' : ''}>${p.title}</option>`;
            });

            const wbSelect = document.getElementById('c-worldbooks');
            wbSelect.innerHTML = '';
            appData.worldbooks.forEach(wb => {
                const isSel = c.worldbooks.includes(wb.id);
                wbSelect.innerHTML += `<option value="${wb.id}" ${isSel ? 'selected' : ''}>关键词: ${wb.keys}</option>`;
            });
        }

        function saveCurrentContact() {
            const c = appData.contacts.find(c => c.id === currentActiveContactId);
            if (!c) return;
            c.name = document.getElementById('c-name').value;
            c.prompt = document.getElementById('c-prompt').value;
            c.personaId = document.getElementById('c-persona').value;

            const wbSelect = document.getElementById('c-worldbooks');
            c.worldbooks = Array.from(wbSelect.selectedOptions).map(opt => opt.value);
            renderChatList();
        }

        function addNewContact() {
            const id = 'c_' + Date.now();
            appData.contacts.push({ id, name: '新联系人', prompt: '', personaId: '', worldbooks: [], history: [] });
            currentActiveContactId = id;
            renderAll();
        }

        function deleteCurrentContact() {
            if (confirm("确定要删除该联系人及其全部数据吗？")) {
                appData.contacts = appData.contacts.filter(c => c.id !== currentActiveContactId);
                if (appData.contacts.length > 0) currentActiveContactId = appData.contacts[0].id;
                renderAll();
            }
        }

        /* ----- 自设与世界书逻辑 ----- */
        function renderPersonaList() {
            const list = document.getElementById('persona-list');
            list.innerHTML = '';
            appData.personas.forEach(p => {
                const item = document.createElement('div');
                item.className = `list-item ${p.id === currentActivePersonaId ? 'active' : ''}`;
                item.onclick = () => { currentActivePersonaId = p.id; renderPersonaList(); loadPersonaDetail(); };
                item.innerHTML = `<div style="font-weight:600">${p.title}</div>`;
                list.appendChild(item);
            });
            loadPersonaDetail();
        }

        function loadPersonaDetail() {
            const p = appData.personas.find(p => p.id === currentActivePersonaId);
            if (!p) return;
            document.getElementById('p-title').value = p.title;
            document.getElementById('p-desc').value = p.desc;
        }

        function saveCurrentPersona() {
            const p = appData.personas.find(p => p.id === currentActivePersonaId);
            if (!p) return;
            p.title = document.getElementById('p-title').value;
            p.desc = document.getElementById('p-desc').value;
            renderPersonaList();
        }

        function addNewPersona() {
            const id = 'p_' + Date.now();
            appData.personas.push({ id, title: '新身份', desc: '' });
            currentActivePersonaId = id;
            renderPersonaList();
        }

        function renderWorldbookList() {
            const list = document.getElementById('worldbook-list');
            list.innerHTML = '';
            appData.worldbooks.forEach(wb => {
                const item = document.createElement('div');
                item.className = `list-item ${wb.id === currentActiveWBId ? 'active' : ''}`;
                item.onclick = () => { currentActiveWBId = wb.id; renderWorldbookList(); loadWBDetail(); };
                item.innerHTML = `<div style="font-weight:600">${wb.keys || '未命名词条'}</div>`;
                list.appendChild(item);
            });
            loadWBDetail();
        }

        function loadWBDetail() {
            const wb = appData.worldbooks.find(w => w.id === currentActiveWBId);
            if (!wb) return;
            document.getElementById('wb-keys').value = wb.keys;
            document.getElementById('wb-content').value = wb.content;
        }

        function saveCurrentWB() {
            const wb = appData.worldbooks.find(w => w.id === currentActiveWBId);
            if (!wb) return;
            wb.keys = document.getElementById('wb-keys').value;
            wb.content = document.getElementById('wb-content').value;
            renderWorldbookList();
        }

        function addNewWorldbookEntry() {
            const id = 'wb_' + Date.now();
            appData.worldbooks.push({ id, keys: '新触发词', content: '' });
            currentActiveWBId = id;
            renderWorldbookList();
        }

        /* ----- 数据导出与导入 ----- */
        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `AI_Companion_Backup_${Date.now()}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    appData = JSON.parse(event.target.result);
                    renderAll();
                    alert('配置文件导入成功！');
                } catch (err) {
                    alert('导入失败，文件格式有误！');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
