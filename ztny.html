<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正态分布图 (Normal Distribution)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--subtext-color);
        }

        .chart-container {
            width: 100%;
            margin: 20px 0;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .formula-box {
            margin-top: 20px;
            padding: 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            border-left: 4px solid var(--accent-color);
            text-align: center;
        }

        .formula {
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            font-style: italic;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .formula-desc {
            font-size: 12px;
            color: var(--subtext-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--subtext-color);
            margin-top: 4px;
        }

        /* 领带默认隐藏，戴上时显示 */
        .tie-group {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tie-group.show {
            opacity: 1;
        }

        /* 扭腰动画（只作用于中下部分） */
        .twist-area {
            transform-origin: 400px 100px; /* 顶部固定的旋转基准点 */
        }

        .twist-area.animating {
            animation: hipShake 0.4s ease-in-out infinite alternate;
        }

        @keyframes hipShake {
            0% {
                transform: rotate(-10deg) skewX(-12deg);
            }
            100% {
                transform: rotate(10deg) skewX(12deg);
            }
        }

        /* 播放按钮 */
        .play-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            outline: none;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 字幕弹幕容器（已针对手机端防防超宽做优化） */
        .subtitle-box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 99;
            pointer-events: none;
            text-align: center;
            max-width: 90vw; /* 适应手机屏幕，防止超出两边 */
            white-space: normal;
            word-break: break-word;
        }

        .subtitle-box.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>正态分布曲线 (Normal Distribution)</h1>
            <p class="subtitle">高斯分布概率密度函数图形展示 · μ = 0, σ = 1</p>
        </header>

        <div class="chart-container">
            <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <!-- 裁剪中下部分（保留顶点和上部不变） -->
                    <clipPath id="lowerBodyClip">
                        <rect x="0" y="100" width="800" height="300" />
                    </clipPath>
                    <!-- 裁剪上部分（保持静止） -->
                    <clipPath id="upperBodyClip">
                        <rect x="0" y="0" width="800" height="100" />
                    </clipPath>
                </defs>

                <!-- 1. 静止区域（顶部曲线 + 领带 + 均值顶线） -->
                <g class="static-upper-area">
                    <!-- 曲线顶部 -->
                    <path d="M 100 320 
                             C 200 320, 220 315, 250 280 
                             C 280 240, 310 180, 350 100 
                             C 380 40, 390 40, 400 40 
                             C 410 40, 420 40, 450 100 
                             C 490 180, 520 240, 550 280 
                             C 580 315, 600 320, 700 320" 
                          fill="none" 
                          stroke="#38bdf8" 
                          stroke-width="3.5" 
                          filter="url(#glow)" 
                          clip-path="url(#upperBodyClip)" />

                    <!-- 顶部辅助线 -->
                    <line x1="400" y1="40" x2="400" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5"/>

                    <!-- 领带图形 (默认隐藏，扭腰时出现) -->
                    <g class="tie-group" id="tieGroup">
                        <!-- 领带结 -->
                        <polygon points="392,42 408,42 405,52 395,52" fill="#f43f5e" stroke="#be123c" stroke-width="1"/>
                        <!-- 领带主体 -->
                        <polygon points="395,52 405,52 410,85 400,95 390,85" fill="#e11d48" stroke="#be123c" stroke-width="1"/>
                    </g>
                </g>

                <!-- 2. 扭转区域（中下部曲线 + 下半部分虚线 + 坐标轴 + 数据卡片） -->
                <g class="twist-area" id="twistArea">
                    <!-- 背景网格线 -->
                    <line x1="100" y1="320" x2="700" y2="320" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    <line x1="100" y1="240" x2="700" y2="240" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="100" y1="160" x2="700" y2="160" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4"/>

                    <!-- 标准差辅助虚线（中下部） -->
                    <line x1="250" y1="320" x2="250" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                    <line x1="325" y1="320" x2="325" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                    <line x1="400" y1="320" x2="400" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5"/>
                    <line x1="475" y1="320" x2="475" y2="140" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
                    <line x1="550" y1="320" x2="550" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

                    <!-- 钟形曲线填充（中下部） -->
                    <path d="M 100 320 
                             C 200 320, 220 315, 250 280 
                             C 280 240, 310 180, 350 100 
                             C 380 40, 390 40, 400 40 
                             C 410 40, 420 40, 450 100 
                             C 490 180, 520 240, 550 280 
                             C 580 315, 600 320, 700 320 
                             Z" 
                          fill="url(#curveGradient)" />

                    <!-- 钟形曲线线条（中下部） -->
                    <path d="M 100 320 
                             C 200 320, 220 315, 250 280 
                             C 280 240, 310 180, 350 100 
                             C 380 40, 390 40, 400 40 
                             C 410 40, 420 40, 450 100 
                             C 490 180, 520 240, 550 280 
                             C 580 315, 600 320, 700 320" 
                          fill="none" 
                          stroke="#38bdf8" 
                          stroke-width="3.5" 
                          filter="url(#glow)" 
                          clip-path="url(#lowerBodyClip)"/>

                    <!-- X 轴 -->
                    <line x1="80" y1="320" x2="720" y2="320" stroke="#cbd5e1" stroke-width="2"/>

                    <!-- 坐标刻度与标签 -->
                    <text x="400" y="345" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">μ (0)</text>
                    <text x="475" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+1σ</text>
                    <text x="550" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+2σ</text>
                    <text x="625" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">+3σ</text>
                    <text x="325" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-1σ</text>
                    <text x="250" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-2σ</text>
                    <text x="175" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">-3σ</text>

                    <!-- 核心数据标注 -->
                    <text x="400" y="180" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="bold">68.27%</text>
                    <text x="400" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">(±1σ 范围)</text>
                </g>
            </svg>
        </div>

        <div class="formula-box">
            <div class="formula">
                f(x) = (1 / (σ √(2π))) · e<sup>-[ (x - μ)² / (2σ²) ]</sup>
            </div>
            <div class="formula-desc">
                正态分布（高斯分布）概率密度函数公式
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">68.27%</div>
                <div class="stat-label">落在 [μ-σ, μ+σ]</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">95.45%</div>
                <div class="stat-label">落在 [μ-2σ, μ+2σ]</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">99.73%</div>
                <div class="stat-label">落在 [μ-3σ, μ+3σ]</div>
            </div>
        </div>
    </div>

    <!-- 播放按钮 -->
    <button class="play-btn" id="playBtn" title="播放字幕与扭腰">▶</button>

    <!-- 字幕容器 -->
    <div class="subtitle-box" id="subtitleBox"></div>

    <script>
        const subtitles = [
            "隔壁班新转来一个正太",
            "他靠扭腰吸引了很多妹子",
            "我们都扭不过他",
            "可我早就不扭了",
            "嫂子也在！！！",
            "什么⁉把我的领带拿来"
        ];

        const playBtn = document.getElementById('playBtn');
        const subtitleBox = document.getElementById('subtitleBox');
        const twistArea = document.getElementById('twistArea');
        const tieGroup = document.getElementById('tieGroup');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('disabled');

            let index = 0;

            function showNextSubtitle() {
                if (index < subtitles.length) {
                    const currentText = subtitles[index];
                    subtitleBox.textContent = currentText;
                    subtitleBox.classList.add('show');

                    // 当出现“把我的领带拿来”这句字幕时：戴上领带，并开启 5 秒扭腰动画
                    if (currentText.includes("把我的领带拿来")) {
                        tieGroup.classList.add('show');
                        twistArea.classList.add('animating');

                        setTimeout(() => {
                            twistArea.classList.remove('animating');
                            tieGroup.classList.remove('show');
                        }, 5000); // 扭腰持续5秒
                    }

                    // 每条字幕展示 1 秒（1000ms）
                    setTimeout(() => {
                        subtitleBox.classList.remove('show');
                        index++;
                        // 间隔 200ms 出现下一条
                        setTimeout(showNextSubtitle, 200);
                    }, 1000);
                } else {
                    isPlaying = false;
                    playBtn.classList.remove('disabled');
                }
            }

            showNextSubtitle();
        });
    </script>
</body>
</html>
